<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Tracking</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080d12;
  color: #e8fff7;
  font-family: Arial, sans-serif;
  text-align: center;
}

header { padding: 18px; }

h2 {
  color: #00dff0;
  margin-bottom: 6px;
}

.camera {
  position: relative;
  width: 94%;
  max-width: 700px;
  margin: 12px auto;
  overflow: hidden;
  border: 1px solid #00ffc355;
  border-radius: 16px;
  background: #101820;
}

video {
  display: block;
  width: 100%;
  transform: scaleX(-1);
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: scaleX(-1);
}

.panel {
  margin: 16px auto;
  padding: 16px;
  width: 94%;
  max-width: 700px;
  border: 1px solid #00ffc333;
  border-radius: 12px;
  text-align: left;
  background: #101820;
}

.stat {
  display: flex;
  justify-content: space-between;
  padding: 9px 0;
  border-bottom: 1px solid #ffffff15;
}

.value { color: #00dff0; }

button {
  background: #00dff0;
  color: #06110e;
  border: none;
  border-radius: 10px;
  padding: 13px 20px;
  font-weight: bold;
  font-size: 15px;
  margin: 10px;
}

#status { color: #00dff0; }
</style>
</head>

<body>
<header>
  <h2>Hand Tracking</h2>
  <div>By Charissanp^^</div>
  <p id="status">Memuat sistem...</p>
</header>

<div class="camera">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<button id="start">AKTIFKAN KAMERA</button>

<div class="panel">
  <div class="stat">
    <span>Tangan terdeteksi</span>
    <span class="value" id="count">0</span>
  </div>
  <div class="stat">
    <span>Jumlah landmark</span>
    <span class="value" id="landmarks">0</span>
  </div>
  <div class="stat">
    <span>Jarak jari</span>
    <span class="value" id="distance">--</span>
  </div>
  <div class="stat">
    <span>Posisi telunjuk</span>
    <span class="value" id="position">--</span>
  </div>
  <div class="stat">
    <span>Gesture</span>
    <span class="value" id="gesture">--</span>
  </div>
</div>

<script type="module">
import {
  HandLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");

let tracker;
let stream;
let running = false;
let lastVideoTime = -1;

async function initialize() {
  status.textContent = "Memuat";

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  tracker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 2,
    minHandDetectionConfidence: 0.5,
    minHandPresenceConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  status.textContent = "Aktifkan kamera";
}

function drawHand(points) {
  const connections = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12],
    [9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],
    [0,17]
  ];

  ctx.lineWidth = 3;
  ctx.strokeStyle = "#00dff0";

  for (const [a,b] of connections) {
    ctx.beginPath();
    ctx.moveTo(points[a].x * canvas.width,
               points[a].y * canvas.height);
    ctx.lineTo(points[b].x * canvas.width,
               points[b].y * canvas.height);
    ctx.stroke();
  }

  points.forEach((p, i) => {
    ctx.beginPath();
    ctx.arc(
      p.x * canvas.width,
      p.y * canvas.height,
      i === 4 || i === 8 ? 7 : 4,
      0, Math.PI * 2
    );
    ctx.fillStyle =
      i === 8 ? "#ffcc00" :
      i === 4 ? "#ff6699" : "#ffffff";
    ctx.fill();
  });
}

function animate() {
  if (!running) return;

  if (video.readyState >= 2 &&
      video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const result = tracker.detectForVideo(
      video, performance.now()
    );

    const allHands = result.landmarks || [];
    document.getElementById("count").textContent =
      allHands.length;

    document.getElementById("landmarks").textContent =
      allHands.length * 21;

    if (allHands.length > 0) {
      const p = allHands[0];
      drawHand(p);

      const thumb = p[4];
      const index = p[8];
      const dx = thumb.x - index.x;
      const dy = thumb.y - index.y;
      const dz = thumb.z - index.z;
      const distance = Math.sqrt(dx*dx + dy*dy + dz*dz);

      document.getElementById("distance").textContent =
        distance.toFixed(4);

      document.getElementById("position").textContent =
        `${(index.x*100).toFixed(1)}%, ${(index.y*100).toFixed(1)}%`;

      document.getElementById("gesture").textContent =
        distance < 0.05 ? "PINCH" : "OPEN / MOVE";

      status.textContent = "Tracking aktif";
    } else {
      document.getElementById("distance").textContent = "--";
      document.getElementById("position").textContent = "--";
      document.getElementById("gesture").textContent = "--";
      status.textContent = "Arahkan tangan ke kamera";
    }
  }

  requestAnimationFrame(animate);
}

document.getElementById("start").addEventListener("click",
async () => {
  try {
    document.getElementById("start").disabled = true;
    status.textContent = "Meminta izin kamera...";

    if (!tracker) await initialize();

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: { ideal: 640 },
        height: { ideal: 480 }
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    running = true;
    status.textContent = "Tracking aktif";
    animate();
  } catch (error) {
    status.textContent = "Error: " + error.message;
    document.getElementById("start").disabled = false;
  }
});
</script>
</body>
</html>
